registry:
  env:
    remoteRef: jarvis/registry-env
  secretStore:
    provider:
      aws:
        service: SecretsManager
        region: us-east-1
        auth:
          jwt:
            serviceAccountRef:
              name: jarvis-registry-sa
  mongodb:
    enabled: false
  redis:
    enabled: false
  weaviate:
    enabled: false
  skillScan:
    enabled: true
