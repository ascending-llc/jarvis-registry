registry:
  env:
    remoteRef: jarvis/registry-env
  secretStore:
    provider:
      aws:
        service: SecretsManager
        region: us-east-1
        auth:
          jwt:
            serviceAccountRef:
              name: jarvis-registry-sa
  ingress:
    enabled: true
    className: alb
    host: registry.example.com
  skillScan:
    enabled: true
