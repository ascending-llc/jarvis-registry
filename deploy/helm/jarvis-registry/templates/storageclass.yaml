# StorageClass
{{- if and .Values.registry.standalone .Values.registry.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ required "storageClass.name must be set when storageClass.create is true" .Values.registry.storageClass.name }}
provisioner: {{ required "storageClass.provisioner must be set when storageClass.create is true" .Values.registry.storageClass.provisioner }}
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  {{- if .Values.registry.storageClass.parameters }}
  {{- toYaml .Values.registry.storageClass.parameters | nindent 2 }}
  {{- end }}
{{- end}}
