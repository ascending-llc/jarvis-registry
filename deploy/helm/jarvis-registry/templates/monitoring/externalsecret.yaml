{{- if and .Values.registry.monitoring.enabled .Values.registry.monitoring.externalSecrets.enabled }}
{{- $es := .Values.registry.monitoring.externalSecrets }}
{{- $keys := include "jarvis-registry.monitoring.neededSecretKeys" . | trim | splitList "\n" | compact }}
{{- if $keys }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $es.secretStoreRef.name }}
  namespace: {{ .Values.registry.monitoring.namespace }}
  labels:
    {{- include "jarvis-registry.labels" . | nindent 4 }}
spec:
  provider:
    {{- if not $es.provider }}
    {{- fail "registry.monitoring.externalSecrets.provider must be set when registry.monitoring.externalSecrets.enabled is true and at least one monitoring secret key is needed (current backend/gateway/grafana settings require one)" }}
    {{- end }}
    {{- toYaml $es.provider | nindent 4 }}
{{- if $es.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.serviceAccount.name }}
  namespace: {{ .Values.registry.monitoring.namespace }}
  labels:
    {{- include "jarvis-registry.labels" . | nindent 4 }}
  {{- with $es.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# Only fetches the specific keys the currently-enabled monitoring features
# need (see jarvis-registry.monitoring.neededSecretKeys) — never the whole
# upstream secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.targetSecretName }}
  namespace: {{ .Values.registry.monitoring.namespace }}
  labels:
    {{- include "jarvis-registry.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ $es.targetSecretName }}
    creationPolicy: Owner
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ required "registry.monitoring.externalSecrets.remoteRef must be set" $es.remoteRef }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
