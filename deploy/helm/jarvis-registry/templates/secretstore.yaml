{{- if and .Values.registry.externalSecrets.enabled (not .Values.registry.env.secretStoreRef.name) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "jarvis-registry.secretStoreName" . }}
  labels:
    {{- include "jarvis-registry.labels" . | nindent 4 }}
spec:
  provider:
    {{- if not .Values.registry.secretStore.provider }}
    {{- fail "registry.secretStore.provider must be set when registry.externalSecrets.enabled is true" }}
    {{- end }}
    {{- toYaml .Values.registry.secretStore.provider | nindent 4 }}
{{- end }}
