{{- if and .Values.registry.standalone .Values.registry.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.registry.env.secretStoreRef.name }}
spec:
  provider:
    {{- if not .Values.registry.secretStore.provider }}
    {{- fail "registry.secretStore.provider must be set when registry.standalone and registry.externalSecrets.enabled are both true" }}
    {{- end }}
    {{- toYaml .Values.registry.secretStore.provider | nindent 4 }}
{{- end }}
