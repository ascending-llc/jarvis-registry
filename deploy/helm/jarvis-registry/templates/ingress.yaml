{{- if .Values.registry.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jarvis-registry.fullname" . }}
  labels:
    {{- include "jarvis-registry.labels" . | nindent 4 }}
  {{- with .Values.registry.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.registry.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.registry.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: auth-server
                port:
                  number: {{ .Values.registry.authServer.service.port }}
          - path: {{ .Values.registry.ingress.authServerPathPrefix | default "/auth" }}
            pathType: Prefix
            backend:
              service:
                name: auth-server
                port:
                  number: {{ .Values.registry.authServer.service.port }}
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: registry-frontend
                port:
                  number: {{ .Values.registry.frontend.service.port }}
      {{- with .Values.registry.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
