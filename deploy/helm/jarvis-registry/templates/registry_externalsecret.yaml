{{- if .Values.registry.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.registry.env.targetSecretName }}
  labels:
    {{- include "jarvis-registry.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.registry.env.refreshInterval }}
  secretStoreRef:
    name: {{ include "jarvis-registry.secretStoreName" . }}
    kind: {{ .Values.registry.env.secretStoreRef.kind }}
  target:
    name: {{ .Values.registry.env.targetSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "registry.env.remoteRef must be set" .Values.registry.env.remoteRef }}
{{- end }}
