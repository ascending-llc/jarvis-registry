# Pre-commit hooks configuration
# See https://pre-commit.com for more information
# Run `uv run poe hooks-install` to install hooks locally

repos:
  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/
      - id: end-of-file-fixer
        exclude: ^frontend/
      - id: check-yaml
        args: [--unsafe]
        exclude: ^deploy/(helm|terraform/modules/.*/charts)/.*/templates/
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|frontend/)

  # Local hooks using poethepoet
  - repo: local
    hooks:
      - id: lint-fix
        name: Run lint-fix
        entry: uv run poe lint-fix
        language: system
        pass_filenames: false
        always_run: true
      - id: terraform-fmt
        name: Check Terraform formatting
        entry: bash -c 'command -v terraform >/dev/null || { echo "terraform not found; install terraform >= 1.11 to check deploy/ files" >&2; exit 1; }; terraform fmt -check -recursive deploy/'
        language: system
        files: ^deploy/(terraform|examples)/.*\.(tf|tftest\.hcl)$
        pass_filenames: false
      - id: helm-lint
        name: Lint Helm charts
        entry: bash -c 'command -v helm >/dev/null || { echo "helm not found; install helm to lint deploy/ charts" >&2; exit 1; }; for f in deploy/helm/jarvis-registry/tests/values/*.yaml; do helm lint deploy/helm/jarvis-registry -f "$f" || exit 1; done && helm lint deploy/terraform/modules/eks-cluster/charts/cluster-defaults'
        language: system
        files: ^deploy/(helm/jarvis-registry|terraform/modules/eks-cluster/charts/cluster-defaults)/
        pass_filenames: false

  # If uv.lock changes after a git pull, run `uv sync`.
  - repo: https://github.com/satoseino/shell-cmd-on-change
    rev: "2.1.0"
    hooks:
      - id: shell-cmd-on-change
        name: uv-sync
        args:
          - "-Puv.lock"
          - "uv sync"
        stages: [post-merge]
        always_run: true
        verbose: true

  # If frontend/package-lock.json changes after a git pull, run `npm --prefix ./frontend/ ci`
  - repo: https://github.com/satoseino/shell-cmd-on-change
    rev: "2.1.0"
    hooks:
      - id: shell-cmd-on-change
        name: npm-ci
        args:
          - "-Pfrontend/package-lock.json"
          - "npm --prefix ./frontend/ ci"
        stages: [post-merge]
        always_run: true
        verbose: true

  # Prevent credentials from getting into the code base.
  - repo: https://github.com/satoseino/gelato
    rev: "v0.1.0"
    hooks:
      - id: gelato
