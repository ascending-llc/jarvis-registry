receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Debug: Prints logs to the collector's console output (docker logs otel-collector)
  debug:
    verbosity: detailed

  # Optional: Forward metrics to Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Receives semantic MCP tool and A2A agent spans emitted by Jarvis Registry.
  otlp_http/langfuse:
    endpoint: https://us.cloud.langfuse.com/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTHORIZATION}"
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - otlp_http/langfuse
