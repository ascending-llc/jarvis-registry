service_name: registry

counters:
  # Registry operations
  - name: registry_operations_total
    description: Total number of registry operations
    unit: "1"
    capture: true

  # MCP server requests (labels: server_name, mode = gateway | proxy)
  - name: mcp_server_requests_total
    description: Total requests to MCP servers
    unit: "1"
    capture: true

  # Tool discovery
  - name: mcp_tool_discovery_total
    description: Total number of tool discovery operations
    unit: "1"
    capture: true

  # Tool execution
  - name: mcp_tool_execution_total
    description: Total number of tool executions
    unit: "1"
    capture: true

  # Resource access
  - name: mcp_resource_access_total
    description: Total number of resource access operations
    unit: "1"
    capture: true

  # Prompt retrieval
  - name: mcp_prompt_get_total
    description: Total number of prompt retrievals
    unit: "1"
    capture: true

  # Direct MCP proxy: requests sent to the server, by outcome
  # (labels: server_name, http_method, mcp_method, status = success | failure | input_required | cancelled)
  - name: mcp_proxy_requests_total
    description: Requests the direct MCP proxy sent to a server, by outcome
    unit: "1"
    capture: true

  # Direct MCP proxy: tools/call requests sent to the server
  # (labels: tool_name = a tool registered on the server, or "other", server_name, status)
  - name: mcp_proxy_tool_calls_total
    description: tools/call requests the direct MCP proxy sent to a server, by outcome
    unit: "1"
    capture: true

  # Auth requests (for middleware)
  - name: auth_requests_total
    description: Total number of authentication attempts
    unit: "1"
    capture: true

  # Workflow: executor invocations
  - name: workflow_agent_invocations_total
    description: Total workflow executor invocations (MCP, A2A, pool, builtin)
    unit: "1"
    capture: true

  # Workflow: workflow runs
  - name: workflow_runs_total
    description: Total workflow run completions
    unit: "1"
    capture: true

  # Workflow: tool-level calls within MCP agent executions
  - name: workflow_tool_calls_total
    description: Total MCP tool calls within agent executions
    unit: "1"
    capture: true

  # Workflow: LLM tokens the model provider reported for an executor's agent run
  # (labels: agent_type = mcp | a2a_pool, executor_key, model, direction = input | output)
  - name: workflow_llm_tokens_total
    description: Total LLM tokens used by workflow executors
    unit: "1"
    capture: true

  # Workflow: list price of those tokens in USD, left out for models LiteLLM has no price for
  # (labels: agent_type, executor_key, model)
  - name: workflow_llm_cost_usd_total
    description: List price in USD of the LLM tokens used by workflow executors
    unit: "1"
    capture: true

  # Skill scan: per-tool runs (labels: tool, status, status_reason)
  - name: skill_scan_tool_runs_total
    description: Total skill-scan tool runs
    unit: "1"
    capture: true

  # Skill scan: LLM tokens (labels: tool, direction = input|output)
  - name: skill_scan_llm_tokens_total
    description: Total LLM tokens used by skill-scan tools
    unit: "1"
    capture: true

  # Skill scan: finished jobs (label: outcome = done|requeued|retried|lease_lost|failed)
  - name: skill_scan_jobs_finished_total
    description: Total finished skill-scan jobs by outcome
    unit: "1"
    capture: true

histograms:
  # Registry operation latency
  - name: registry_operation_duration_seconds
    description: Registry operation latency in seconds
    unit: "s"
    capture: true

  # Tool execution latency
  - name: mcp_tool_execution_duration_seconds
    description: Tool execution duration in seconds
    unit: "s"
    capture: true

  # Tool discovery latency
  - name: mcp_tool_discovery_duration_seconds
    description: Tool discovery latency in seconds
    unit: "s"
    capture: true

  # Resource access latency
  - name: mcp_resource_access_duration_seconds
    description: Resource access duration in seconds
    unit: "s"
    capture: true

  # Prompt retrieval latency
  - name: mcp_prompt_get_duration_seconds
    description: Prompt retrieval duration in seconds
    unit: "s"
    capture: true

  # Direct MCP proxy: time until the request's outcome was known
  # (labels: server_name, http_method, mcp_method, status)
  - name: mcp_proxy_request_duration_seconds
    description: >-
      Direct MCP proxy request duration in seconds. POST: until the response is complete, which
      for an SSE response is when its body has been read to the end. GET: until the server sends
      its response headers.
    unit: "s"
    capture: true

  # Auth request latency (for middleware)
  - name: auth_request_duration_seconds
    description: Authentication request duration in seconds
    unit: "s"
    capture: true

  # Workflow: executor call latency
  - name: workflow_agent_call_seconds
    description: Workflow executor call latency in seconds
    unit: "s"
    capture: true

  # Workflow: workflow run latency
  - name: workflow_run_seconds
    description: Total workflow run latency in seconds
    unit: "s"
    capture: true

  # Workflow: individual MCP tool call latency
  - name: workflow_tool_call_seconds
    description: Individual MCP tool call latency in seconds
    unit: "s"
    capture: true

  # Skill scan: per-tool run duration (label: tool)
  - name: skill_scan_tool_duration_seconds
    description: Skill-scan tool run duration in seconds
    unit: "s"
    capture: true
