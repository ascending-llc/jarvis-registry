# Pure new RBAC scopes for registry server/agent/federation APIs.
# Scopes configuration for role-based permissions focused on first-class resource APIs.
#
# Federation authorization uses a two-layer model:
# - scopes control access to federation-related endpoints
# - ACL controls access to a specific federation resource
# Therefore `federations-read` / `federations-write` do not replace resource ACL;
# they work together with the generic `/permissions/{resource_type}/{resource_id}` APIs.
#
# Roles:
# - registry-admin: full access
# - registry-power-user: create/update/delete federation/server/agent resources and manage ACL
# - register-user: create/update/delete federation/server/agent resources, but not share them
# - register-read-only: read-only access to federation/server/agent resources

group_mappings:
  jarvis-registry-admin:
    - servers-read
    - servers-write
    - agents-read
    - agents-write
    - federations-read
    - federations-write
    - federations-share
    - servers-share
    - agents-share
    - workflows-read
    - workflows-write
    - system-ops
    - user-read
    - acl-read
    - acl-write
    - mcp-proxy-ops
    - a2a-proxy-ops
    - skills-read
    - skills-write
    - workflows-control
    - workflows-share
  jarvis-registry-power-user:
    - servers-read
    - servers-write
    - agents-read
    - agents-write
    - federations-read
    - federations-write
    - federations-share
    - servers-share
    - agents-share
    - workflows-read
    - workflows-write
    - user-read
    - acl-read
    - acl-write
    - mcp-proxy-ops
    - a2a-proxy-ops
    - skills-read
    - skills-write
    - workflows-control
    - workflows-share
  jarvis-registry-user:
    - servers-read
    - servers-write
    - agents-read
    - agents-write
    - federations-read
    - federations-write
    - workflows-read
    - workflows-write
    - user-read
    - acl-read
    - mcp-proxy-ops
    - a2a-proxy-ops
    - skills-read
    - skills-write
    - workflows-control
  jarvis-registry-read-only:
    - servers-read
    - agents-read
    - federations-read
    - workflows-read
    - user-read
    - acl-read
    - skills-read

servers-read:
  description: "View registered MCP servers, their tools, and connection status."
  actions:
  - action: list_servers
    method: GET
    endpoint: /servers
  - action: get_server
    method: GET
    endpoint: /servers/{server_id}
  - action: servers_connection
    method: POST
    endpoint: /servers/connection
  - action: get_server_tools
    method: GET
    endpoint: /servers/{server_id}/tools

servers-write:
  description: "Register, modify, delete, enable/disable, and refresh MCP servers."
  actions:
  - action: register_service
    method: POST
    endpoint: /servers
  - action: modify_service
    method: PATCH
    endpoint: /servers/{server_id}
  - action: delete_service
    method: DELETE
    endpoint: /servers/{server_id}
  - action: toggle_service
    method: POST
    endpoint: /servers/{server_id}/toggle
  - action: refresh_server_capabilities
    method: POST
    endpoint: /servers/{server_id}/refresh

agents-read:
  description: "View registered A2A agents, their skills, health, and ratings, and discover agents by capability."
  actions:
  - action: list_agents
    method: GET
    endpoint: /agents
  - action: get_agent
    method: GET
    endpoint: /agents/{agent_id}
  - action: get_agent_skills
    method: GET
    endpoint: /agents/{agent_id}/skills
  - action: get_agent_rating
    method: GET
    endpoint: /agents/{agent_id}/rating
  - action: discover_agents
    method: POST
    endpoint: /agents/discover
  - action: discover_agents_semantic
    method: POST
    endpoint: /agents/discover/semantic
  - action: check_agent_health
    method: POST
    endpoint: /agents/{agent_id}/health
  - action: get_agent_wellknown_card
    method: GET
    endpoint: /agents/.well-known/agent-cards

agents-write:
  description: "Register, modify, delete, enable/disable, and refresh A2A agents, and sync their well-known agent cards."
  actions:
  - action: create_agent
    method: POST
    endpoint: /agents
  - action: modify_agent
    method: PATCH
    endpoint: /agents/{agent_id}
  - action: delete_agent
    method: DELETE
    endpoint: /agents/{agent_id}
  - action: toggle_agent
    method: POST
    endpoint: /agents/{agent_id}/toggle
  - action: refresh_agent_capabilities
    method: POST
    endpoint: /agents/{agent_id}/refresh
  - action: sync_wellknown
    method: POST
    endpoint: /agents/{agent_id}/wellknown

federations-read:
  description: "View federated registries and their sync jobs."
  actions:
  # Federation read scopes only allow access to federation read endpoints.
  # Resource-level visibility is still filtered by ACL at runtime.
  - action: list_federations
    method: GET
    endpoint: /federations
  - action: get_federation
    method: GET
    endpoint: /federations/{federation_id}
  - action: get_federation_sync_job
    method: GET
    endpoint: /federations/{federation_id}/jobs/{job_id}

federations-write:
  description: "Create, update, sync, and delete federated registry connections."
  actions:
  # Federation write scopes allow create/update/sync/delete endpoints.
  # Update/sync/delete still require resource-level ACL permissions such as EDIT/DELETE.
  - action: create_federation
    method: POST
    endpoint: /federations
  - action: update_federation
    method: PUT
    endpoint: /federations/{federation_id}
  - action: delete_federation
    method: DELETE
    endpoint: /federations/{federation_id}
  - action: sync_federation
    method: POST
    endpoint: /federations/{federation_id}/sync

federations-share:
  description: "Manage who else has access to a federation you own."
  actions:
  # Federation share only manages ACL on the federation resource itself.
  # It does not cascade to synced MCP servers or A2A agents under that federation.
  # Child resources remain independently shareable through `servers-share` and `agents-share`.
  - action: share_federation
    method: PUT
    endpoint: /permissions/federation/{resource_id}

servers-share:
  description: "Manage who else has access to an MCP server you own."
  actions:
  # MCP servers stay independently shareable even when they were created by federation sync.
  # Sharing a federation does not imply sharing any `/permissions/mcpServer/{resource_id}` ACL.
  - action: share_service
    method: PUT
    endpoint: /permissions/mcpServer/{resource_id}

agents-share:
  description: "Manage who else has access to an A2A agent you own."
  actions:
  # A2A agents stay independently shareable even when they were created by federation sync.
  # Sharing a federation does not imply sharing any `/permissions/agent/{resource_id}` ACL.
  - action: share_agent
    method: PUT
    endpoint: /permissions/agent/{resource_id}

user-read:
  description: "View your own account info and the registry version, generate personal access tokens, search the registry, and manage your MCP server connections and OAuth authorizations."
  actions:
  - action: get_user_info
    method: GET
    endpoint: /auth/me
  - action: get_version
    method: GET
    endpoint: /version
  # Token management
  - action: generate_user_token
    method: POST
    endpoint: /tokens/generate
  # Search functionality
  - action: search
    method: POST
    endpoint: /search
  # MCP connection management
  - action: reinitialize_server
    method: POST
    endpoint: /mcp/{server_id}/reinitialize
  - action: get_connection_status
    method: GET
    endpoint: /mcp/connection/status
  - action: get_server_connection_status
    method: GET
    endpoint: /mcp/connection/status/{server_id}
  - action: get_auth_values
    method: GET
    endpoint: /mcp/{server_name}/auth-values
  # MCP OAuth management
  - action: oauth_discover
    method: GET
    endpoint: /mcp/oauth/discover
  - action: oauth_initiate
    method: GET
    endpoint: /mcp/{server_id}/oauth/initiate
  - action: downstream_oauth_authorize
    method: GET
    endpoint: /mcp/downstream/oauth/authorize/{user_id}/{path}
  - action: get_downstream_consent_context
    method: GET
    endpoint: /mcp/consent/downstream
  - action: approve_downstream_consent
    method: POST
    endpoint: /mcp/consent/downstream
  - action: deny_downstream_consent
    method: POST
    endpoint: /mcp/consent/downstream/deny
  - action: get_downstream_error_consent_context
    method: GET
    endpoint: /mcp/consent/downstream-error
  - action: approve_downstream_error_consent
    method: POST
    endpoint: /mcp/consent/downstream-error
  - action: deny_downstream_error_consent
    method: POST
    endpoint: /mcp/consent/downstream-error/deny
  - action: get_server_consent_context
    method: GET
    endpoint: /mcp/consent/server
  - action: approve_server_consent
    method: POST
    endpoint: /mcp/consent/server
  - action: deny_server_consent
    method: POST
    endpoint: /mcp/consent/server/deny
  - action: get_agent_consent_context
    method: GET
    endpoint: /mcp/consent/agent
  - action: approve_agent_consent
    method: POST
    endpoint: /mcp/consent/agent
  - action: deny_agent_consent
    method: POST
    endpoint: /mcp/consent/agent/deny
  - action: oauth_callback
    method: GET
    endpoint: /mcp/{server_path}/oauth/callback
  - action: get_oauth_tokens
    method: GET
    endpoint: /mcp/oauth/tokens/{flow_id}
  - action: get_oauth_status
    method: GET
    endpoint: /mcp/oauth/status/{flow_id}
  - action: cancel_oauth
    method: POST
    endpoint: /mcp/oauth/cancel/{server_id}
  - action: refresh_oauth_token
    method: POST
    endpoint: /mcp/oauth/refresh/{server_id}
  - action: delete_oauth_token
    method: DELETE
    endpoint: /mcp/oauth/token/{server_id}

acl-read:
  description: "View who has access to a given server, agent, federation, or workflow."
  actions:
  # Generic ACL read APIs are also used for federation resources via resource_type=federation.
  - action: search_principals
    method: GET
    endpoint: /permissions/search-principals
  - action: get_resource_permissions
    method: GET
    endpoint: /permissions/{resource_type}/{resource_id}

acl-write:
  description: "Change who has access to a given server, agent, federation, or workflow."
  actions:
  # Generic ACL write APIs are also used for federation resources via resource_type=federation.
  - action: update_resource_permissions
    method: PUT
    endpoint: /permissions/{resource_type}/{resource_id}

system-ops:
  description: "View registry-wide server statistics and administrative tokens."
  actions:
  - action: get_server_stats
    method: GET
    endpoint: /servers/stats
  - action: get_admin_tokens
    method: GET
    endpoint: /admin/tokens

mcp-proxy-ops:
  description: "Act on your behalf to connect to and call tools on your registered MCP servers."
  actions:
  - action: delete_session
    method: DELETE
    endpoint: /proxy/sessions/{server_id}
  - action: connection_mcp
    method: GET,POST
    endpoint: /proxy/mcpgw/mcp
  - action: proxy_to_mcp_servers
    method: GET,POST
    endpoint: /proxy/server/{path}

a2a-proxy-ops:
  description: "Act on your behalf to invoke your registered A2A agents."
  actions:
  - action: proxy_to_a2a
    method: GET,POST,PUT,DELETE
    endpoint: /proxy/a2a/{path}

workflows-read:
  description: "View workflows and their run history, versions, and node-level execution details."
  actions:
  # Read-only access to workflow run status. Granted to all roles including read-only.
  - action: get_run_status
    method: GET
    endpoint: /workflows/{workflow_id}/runs/{run_id}/status
  - action: list_workflows
    method: GET
    endpoint: /workflows
  - action: get_workflow
    method: GET
    endpoint: /workflows/{workflow_id}
  - action: list_workflow_runs
    method: GET
    endpoint: /workflows/{workflow_id}/runs
  - action: get_workflow_run
    method: GET
    endpoint: /workflows/{workflow_id}/runs/{run_id}
  - action: list_child_runs
    method: GET
    endpoint: /workflows/{workflow_id}/runs/{run_id}/children
  - action: list_workflow_versions
    method: GET
    endpoint: /workflows/{workflow_id}/versions
  - action: list_node_runs
    method: GET
    endpoint: /workflows/{workflow_id}/runs/{run_id}/nodes
  - action: get_node_run
    method: GET
    endpoint: /workflows/{workflow_id}/runs/{run_id}/nodes/{node_run_id}

workflows-control:
  description: "Trigger, pause, resume, cancel, retry, approve, and replay workflow runs."
  actions:
  # Write directives to live or finished workflow runs. Requires workflows-read.
  - action: trigger_workflow_run
    method: POST
    endpoint: /workflows/{workflow_id}/runs
  - action: pause_workflow
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/pause
  - action: resume_workflow
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/resume
  - action: cancel_workflow
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/cancel
  - action: retry_workflow
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/retry
  - action: approve_workflow_run
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/approve
  - action: rerun_node
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/nodes/{node_id}/rerun
  - action: replay_run
    method: POST
    endpoint: /workflows/{workflow_id}/runs/{run_id}/replay

workflows-write:
  description: "Create, update, delete, and enable/disable workflows."
  actions:
  - action: create_workflow
    method: POST
    endpoint: /workflows
  - action: update_workflow
    method: PUT
    endpoint: /workflows/{workflow_id}
  - action: delete_workflow
    method: DELETE
    endpoint: /workflows/{workflow_id}
  - action: toggle_workflow
    method: POST
    endpoint: /workflows/{workflow_id}/toggle
  - action: trigger_workflow_run
    method: POST
    endpoint: /workflows/{workflow_id}/runs

workflows-share:
  description: "Manage who else has access to a workflow you own."
  actions:
  - action: share_workflow
    method: PUT
    endpoint: /permissions/workflow/{resource_id}

skills-read:
  description: "View skills and their content and files."
  actions:
  - action: list_skills
    method: GET
    endpoint: /skills
  - action: get_skill
    method: GET
    endpoint: /skills/{skill_id}
  - action: get_skill_content
    method: GET
    endpoint: /skills/{skill_id}/content
  - action: get_skill_file_content
    method: GET
    endpoint: /skills/{skill_id}/files/{path}

skills-write:
  description: "Create, update, delete, and enable/disable skills."
  actions:
  - action: create_skill
    method: POST
    endpoint: /skills
  - action: update_skill
    method: PATCH
    endpoint: /skills/{skill_id}
  - action: delete_skill
    method: DELETE
    endpoint: /skills/{skill_id}
  - action: toggle_skill
    method: POST
    endpoint: /skills/{skill_id}/toggle
