name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  ruff:
    name: "Ruff Lint & Format"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync

    - name: Lint with ruff
      run: |
        uv run ruff check . --output-format=github

    - name: Check formatting with ruff
      run: |
        uv run ruff format --check .

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install bandit
      run: |
        pip install "bandit[toml]"

    # Report only: findings are mostly false positives, so this step never fails the build.
    - name: Security check with bandit
      run: |
        bandit -c pyproject.toml -r registry/src auth-server/src registry-pkgs/src workflow-worker/src -f json -o bandit-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bandit-reports
        path: bandit-report.json
