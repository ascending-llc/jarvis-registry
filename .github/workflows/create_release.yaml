name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Tag to create the release for (e.g. asc1.2.3)"
        required: true
        type: string
      prev_tag:
        description: "Previous tag for release notes base (leave blank to auto-detect)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  # ── AI-generated GitHub Release via github/copilot-release-notes ─────────────
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve previous tag
        id: resolve_prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ inputs.new_tag }}
          PREV_TAG_INPUT: ${{ inputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG_INPUT" ]; then
            PREV_TAG="$PREV_TAG_INPUT"
          else
            # Find the tag of the most recent published (non-draft) GitHub release,
            # skipping NEW_TAG itself if a release was already created for it, and
            # restricted to asc* tags so a cli-v* CLI mirror release (see
            # jarvis-registry-cli's release.yaml) can't be picked as the diff base.
            PREV_TAG=$(gh release list \
              --exclude-drafts \
              --limit 20 \
              --json tagName,isDraft \
              --jq "[.[] | select((.tagName | startswith(\"asc\")) and .tagName != \"${NEW_TAG}\")][0].tagName" \
              2>/dev/null || echo "")
          fi
          if [ -z "$PREV_TAG" ]; then
            echo "❌ Could not determine previous release tag. Pass prev_tag explicitly." >&2
            exit 1
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "📋 Previous release tag: $PREV_TAG"
          echo "📋 New release tag:      $NEW_TAG"

      - name: Generate release notes with Copilot
        id: notes
        uses: github/copilot-release-notes@v1
        timeout-minutes: 30
        with:
          base-ref: ${{ steps.resolve_prev.outputs.prev_tag }}
          head-ref: ${{ inputs.new_tag }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_KEY_PERSONAL }}

      # The action exits successfully even when Copilot couldn't write any notes
      # (e.g. every git call was denied), so gate the release on its JSON outputs:
      # fail when there are no confirmed entries, and create a draft for a human
      # to finish when only some entries are uncertain.
      - name: Check release notes
        id: check_notes
        env:
          ENTRIES: ${{ steps.notes.outputs['release-notes-json'] }}
          UNCERTAIN: ${{ steps.notes.outputs['uncertain-entries'] }}
          SKIPPED: ${{ steps.notes.outputs['skipped-prs'] }}
        run: |
          entries=$(jq length <<< "${ENTRIES:-[]}")
          uncertain=$(jq length <<< "${UNCERTAIN:-[]}")
          skipped=$(jq length <<< "${SKIPPED:-[]}")
          echo "📋 Entries: $entries, uncertain: $uncertain, skipped: $skipped"
          if [ "$entries" -eq 0 ] && [ "$uncertain" -gt 0 ]; then
            echo "::error::Copilot could not confidently describe any PR ($uncertain uncertain). Check the Copilot step's log, fix the cause, and re-run."
            exit 1
          fi
          if [ "$entries" -eq 0 ] && [ "$skipped" -eq 0 ]; then
            echo "::error::Copilot produced no release notes. Check the Copilot step's log, fix the cause, and re-run."
            exit 1
          fi
          if [ "$uncertain" -gt 0 ]; then
            echo "::warning::$uncertain entries need review. Creating a draft release: edit the Needs Review section, then publish it."
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ inputs.new_tag }}
          DRAFT: ${{ steps.check_notes.outputs.draft }}
          # Empty only when every PR was skipped by the style guide's skip rules.
          RELEASE_NOTES: ${{ steps.notes.outputs['release-notes'] || 'Maintenance changes only; no user-facing changes.' }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            release_args=(--draft)
          else
            release_args=(--latest)
          fi
          gh release create "$NEW_TAG" \
            --title "Jarvis Registry $NEW_TAG" \
            --notes "$RELEASE_NOTES" \
            "${release_args[@]}"
        # Changelog generation is a separate manual step: run the "Release
        # Changelog" workflow (release_changelog.yaml, workflow_dispatch) against
        # this tag. If auto-triggering on `release: published` is ever restored,
        # gate it on startsWith(github.event.release.tag_name, 'asc') so it
        # doesn't fire on cli-v* CLI mirror releases.
