name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "Vitest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and format check (Biome)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit tests
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run test
